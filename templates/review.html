<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Expense | LocalLedger AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            background: #f4f6fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .subtitle {
            color: #667085;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .ai-label {
            display: inline-block;
            padding: 7px 12px;
            margin-bottom: 16px;
            border-radius: 20px;
            background: #e8f7ee;
            color: #187744;
            font-size: 13px;
            font-weight: bold;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7dce5;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #c7d2fe;
            border-color: #6366f1;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button,
        .cancel {
            display: inline-block;
            padding: 13px 18px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #4f46e5;
            color: white;
            flex: 1;
        }

        button:hover {
            background: #4338ca;
        }

        .cancel {
            background: #eef0f5;
            color: #344054;
            text-align: center;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 26px;
        }

        .note {
            margin-top: 20px;
            color: #667085;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <span class="ai-label">AI extraction complete</span>

        <h1>Review your expense</h1>

        <p class="subtitle">
            Check the details extracted by LocalLedger AI.
            Correct any mistakes before saving the expense.
        </p>

        <form action="{{ url_for('save_expense') }}" method="POST">

            <div class="field">
                <label for="vendor">Vendor / Merchant</label>
                <input type="text" id="vendor" name="vendor" value="{{ expense.vendor }}" maxlength="200" required>
            </div>

            <div class="field">
                <label for="date">Transaction date</label>
                <input type="date" id="date" name="date" value="{{ expense.date }}">
            </div>

            <div class="grid">
                <div class="field">
                    <label for="subtotal">Subtotal</label>
                    <input type="number" id="subtotal" name="subtotal" min="0" step="0.01"
                        value="{{ '' if expense.subtotal is none else expense.subtotal }}">
                </div>

                <div class="field">
                    <label for="tax">Tax</label>
                    <input type="number" id="tax" name="tax" min="0" step="0.01"
                        value="{{ '' if expense.tax is none else expense.tax }}">
                </div>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="total">Total amount</label>
                    <input type="number" id="total" name="total" min="0" step="0.01"
                        value="{{ '' if expense.total is none else expense.total }}">
                </div>

                <div class="field">
                    <label for="currency">Currency code</label>
                    <input type="text" id="currency" name="currency" value="{{ expense.currency }}"
                        pattern="[A-Za-z]{3}" maxlength="3"
                        title="Enter a three-letter currency code, such as INR or USD" required>
                </div>
            </div>

            <div class="field">
                <label for="category">Expense category</label>

                <select id="category" name="category" required>
                    {% for category in [
                    'Food',
                    'Groceries',
                    'Travel',
                    'Shopping',
                    'Bills',
                    'Healthcare',
                    'Education',
                    'Other'
                    ] %}
                    <option value="{{ category }}" {% if expense.category==category %}selected{% endif %}>
                        {{ category }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <input type="hidden" name="source_file" value="{{ expense.source_file }}">

            <div class="actions">
                <a class="cancel" href="{{ url_for('index') }}">
                    Cancel
                </a>

                <button type="submit">
                    Confirm & Save
                </button>
            </div>
        </form>

        <p class="note">
            Your expense will be saved only after you click
            Confirm & Save. Please verify the amounts and date
            before confirming.
        </p>
    </main>
</body>

</html>
